name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^8.1.4
  firebase_auth: ^5.4.0
  firebase_core: ^3.10.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  get: ^4.7.3
  google_sign_in: 6.2.1
  http: ^1.6.0 

  google_mlkit_text_recognition: ^0.13.0
  pdfx: ^2.6.0

  audio_converter_native: ^1.0.5
  
  path_provider: ^2.1.2

  shared_preferences:
  get_thumbnail_video: ^0.7.3
  cloud_firestore: ^5.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
